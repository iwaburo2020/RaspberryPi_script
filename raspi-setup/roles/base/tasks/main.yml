---
# setup_type-a.sh のネットワーク設定以外の部分

- name: ロケール確認
  ansible.builtin.command: grep -q '^LANG=ja_JP.UTF-8$' /etc/default/locale
  register: locale_chk
  changed_when: false
  failed_when: false

- name: 文字コード設定
  ansible.builtin.command: raspi-config nonint do_change_locale ja_JP.UTF-8
  when: locale_chk.rc != 0

- name: タイムゾーン確認
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: tz_chk
  changed_when: false

- name: タイムゾーン設定
  ansible.builtin.command: raspi-config nonint do_change_timezone Asia/Tokyo
  when: tz_chk.stdout != "Asia/Tokyo"

- name: config.txt 退避(初回のみ)
  ansible.builtin.command: cp -np {{ boot_dir }}/config.txt {{ boot_dir }}/config.txt.org
  args:
    creates: "{{ boot_dir }}/config.txt.org"

- name: config.txt 設定無効化(コメント化)
  ansible.builtin.replace:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^{{ item }}$'
    replace: '#{{ item }}'
  loop:
    - dtparam=audio=on
    - dtoverlay=vc4-kms-v3d
    - max_framebuffers=2

- name: config.txt 追記
  ansible.builtin.blockinfile:
    path: "{{ boot_dir }}/config.txt"
    marker: "# {mark} My Setting Edit"
    block: "{{ config_txt_block }}"

- name: avahi-daemon.socket 停止
  ansible.builtin.systemd_service:
    name: avahi-daemon.socket
    state: stopped
  failed_when: false

- name: avahi-daemon 無効化
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: false
  failed_when: false

- name: apt IPv4固定(99force-ipv4)
  ansible.builtin.get_url:
    url: "{{ config_base_url }}/99force-ipv4.sh"
    dest: /etc/apt/apt.conf.d/99force-ipv4
    force: true
    owner: root
    group: root
    mode: "0644"

- name: apt プロキシ設定(apt.conf)
  ansible.builtin.get_url:
    url: "{{ apt_conf_url }}"
    dest: /etc/apt/apt.conf
    force: true
    owner: root
    group: root
    mode: "0644"

- name: ModemManager 無効化
  ansible.builtin.systemd_service:
    name: ModemManager.service
    enabled: false
  failed_when: false

- name: マウントポイント作成
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /nfs/backup
    - /nfs/script
    - /nfs/www
    - /backup
    - /home/script

- name: fstab 退避(初回のみ)
  ansible.builtin.command: cp -p /etc/fstab /etc/fstab.org
  args:
    creates: /etc/fstab.org

- name: fstab に /nfs/script 追記
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ nfs_script_fstab_line }}"

- name: /usr/local/script シンボリックリンク作成
  ansible.builtin.file:
    src: /nfs/script
    dest: /usr/local/script
    state: link
